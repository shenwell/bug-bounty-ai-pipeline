[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pentest-agents"
version = "0.2.0"
description = "Autonomous bug-bounty framework for Cursor — native subagents, MCP, brain, scaffold"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "shenwell" }]
keywords = [
  "bug-bounty", "pentesting", "security-tools", "cursor", "mcp",
  "agents", "hackerone", "bugcrowd",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
portfolio = [
  "httpx>=0.28",
  "pyyaml>=6",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "tenacity>=9",
  "sqlalchemy>=2.0",
  "python-dotenv>=1.0",
]
portfolio-discover = [
  "pentest-agents[portfolio]",
  "playwright>=1.49",
]
portfolio-board = [
  "pentest-agents[portfolio]",
  "fastapi>=0.115",
  "jinja2>=3.1",
]
writeup-search-faiss = ["faiss-cpu>=1.8", "sentence-transformers>=3"]

[project.scripts]
pentest-scaffold = "tools.scaffold:main"
pentest-portfolio = "tools.portfolio:main"

[project.urls]
Homepage = "https://github.com/shenwell/bug-bounty-ai-pipeline"

[tool.hatch.build.targets.wheel]
packages = ["tools", "portfolio"]

[tool.hatch.build.targets.wheel.force-include]
".cursor/agents" = "pentest_agents_data/agents"
".cursor/skills" = "pentest_agents_data/cursor_skills"
"skills" = "pentest_agents_data/skills"
"rules" = "pentest_agents_data/rules"
"rules/payloads.md" = "pentest_agents_data/payloads.md"
"mcp-bounty-server" = "pentest_agents_data/mcp-bounty-server"
"mcp-writeup-server" = "pentest_agents_data/mcp-writeup-server"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
